<div class="events-head">

    <div class="events-arrows">

        <button type="button" class="arrow-btn" (click)="prev()" aria-label="Previous event">
            <svg width="18" height="14" viewBox="0 0 18 14" fill="none"><path d="M17 7H1M1 7L7 1M1 7L7 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <button type="button" class="arrow-btn" (click)="next()" aria-label="Next event">
            <svg width="18" height="14" viewBox="0 0 18 14" fill="none"><path d="M1 7H17M17 7L11 1M17 7L11 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

    </div>

</div>

<div class="events-track" #track (mouseenter)="pause()" (mouseleave)="resume()">

    @for (event of events; track event.id) {

        <a class="event-card" [routerLink]="['/events', event.id]">

            <div class="event-media">
                <img [src]="event.image" [alt]="event.title" loading="lazy">
            </div>

            <div class="event-body">

                <h3>{{ event.title }}</h3>

                <p>{{ event.description }}</p>

                <span class="event-meta">
                    {{ event.date }} &nbsp;|&nbsp; <strong>{{ event.tag }}</strong>
                </span>

            </div>

        </a>

    }

</div>

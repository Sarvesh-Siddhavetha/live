<div class="feature-card">

    <div class="feature-image-wrap">

        <img
            class="feature-image"
            [src]="image || fallbackImage"
            [alt]="title || 'Feature image'"
            (error)="handleImageError($event)">

    </div>

    <div class="feature-content">

        <span
            class="feature-category"
            *ngIf="category">

            {{ category }}

        </span>

        <h3>

            {{ title }}

        </h3>

        <p>

            {{ description }}

        </p>

    </div>

</div>

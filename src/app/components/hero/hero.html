<section class="hero">

    <div class="hero-content">

        <p class="hero-category">
            {{ category }}
        </p>

        <h1>
            {{ title }}
        </h1>

        <p class="hero-description">
            {{ description }}
        </p>

        <app-button
            [label]="buttonText"
            variant="primary">
        </app-button>

    </div>

    <div class="hero-image">

        <img
            [src]="image"
            [alt]="title">

    </div>

</section>

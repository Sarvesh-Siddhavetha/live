<section class="promise-strip">

    <div class="promise-container">

        <p class="section-label">

            OUR PROMISE

        </p>

        <div class="promise-list">

            @for (item of promises; track item) {

                    {{ item }}

                </span>

            }

        </div>

    </div>

</section>

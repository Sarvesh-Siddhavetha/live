<app-hero
    category="EXPERIENCES & RETREATS"
    title="Heal where it's grown."
    description="Step onto 600 acres of forest and farm for a Siddha medical reset — guided by physicians, rooted in tradition."
    buttonText="Book a Retreat"
    image="assets/images/experience/retreats-hero.jpeg">
</app-hero>

<app-chips
    [chips]="categories">
</app-chips>

<!-- SIGNATURE PROGRAMS -->

<section class="products">

    <div class="section-header">
        <p>SIGNATURE PROGRAMS</p>
        <h2>Signature Programs</h2>
    </div>

    <div class="product-grid">

        <app-product-card
            category="MEDICAL RETREAT"
            title="The Siddha Medical Retreat"
            description="Experience a physician-led wellness journey with detox therapies, traditional Siddha treatments, restorative practices, and personalized healing protocols."
            price="7–21 Days"
            image="assets/images/experience/retreats1.jpeg">
        </app-product-card>

        <app-product-card
            category="LONGEVITY PROGRAM"
            title="Executive Longevity"
            description="Designed for high-performing professionals seeking stress recovery, deep rejuvenation, and sustainable long-term health through Siddha wellness."
            price="Premium"
            image="assets/images/experience/retreats2.jpeg">
        </app-product-card>

        <app-product-card
            category="CORPORATE WELLNESS"
            title="Corporate Mindfulness"
            description="Transform workplace wellness through immersive retreats, mindfulness experiences, and holistic health programs tailored for modern organizations."
            price="Custom"
            image="assets/images/experience/retreats3.jpeg">
        </app-product-card>

    </div>

</section>

<!-- WHAT TO EXPECT -->

<section class="why-made">

    <div class="section-header">
        <p>WHAT TO EXPECT</p>
        <h2>Your Wellness Journey</h2>
    </div>

    <div class="feature-grid">

        <app-feature-card
            category="STEP 01"
            title="Arrival Assessment"
            description="Begin your retreat with a comprehensive Muppini three-humor evaluation to understand your constitution and create a personalized wellness plan."
            image="assets/images/retreats/assessment.png">
        </app-feature-card>

        <app-feature-card
            category="STEP 02"
            title="Healing Therapies"
            description="Experience Varmam therapy, detox treatments, yoga, Kalari training, herbal medicine, and nourishing Siddha cuisine throughout your stay."
            image="assets/images/retreats/therapy.png">
        </app-feature-card>

        <app-feature-card
            category="STEP 03"
            title="Continue at Home"
            description="Leave with a customized wellness protocol, monthly herbal formulations, and ongoing guidance to continue your healing journey."
            image="assets/images/retreats/continuation.png">
        </app-feature-card>

    </div>

</section>

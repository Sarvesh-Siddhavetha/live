<app-hero
    category="WELLNESS TOURISM"
    title="The source, experienced."
    description="Heritage tours, medical-tourism packages, and village immersions — discover Siddha where it was born."
    buttonText="Plan Your Journey"
    image="assets/images/experience/tourism-hero.jpeg">
</app-hero>

<app-chips
    [chips]="categories">
</app-chips>

<!-- JOURNEYS -->

<section class="products">

    <div class="section-header">
        <p>JOURNEYS</p>
        <h2>Experiences to Remember.</h2>
    </div>

    <div class="product-grid">

        <app-product-card
            category="MEDICAL TOURISM"
            title="International Wellness Packages"
            description="Comprehensive medical tourism experiences combining authentic Siddha treatments, luxury accommodation, guided wellness programs, and complete recovery support."
            price="Custom Package"
            image="assets/images/experience/tourism1.jpeg">
        </app-product-card>

        <app-product-card
            category="HERITAGE EXPERIENCE"
            title="Tamil Healing Heritage Tour"
            description="Discover the birthplace of Siddha through sacred temples, medicinal herb gardens, traditional healers, and immersive cultural experiences."
            price="Guided Tour"
            image="assets/images/experience/tourism2.jpeg">
        </app-product-card>

        <app-product-card
            category="CAMPUS IMMERSION"
            title="Village & Campus Stay"
            description="Experience conscious living with sustainable farming, wholesome Siddha cuisine, wellness rituals, and authentic community life."
            price="Weekend Stay"
            image="assets/images/experience/tourism3.jpeg">
        </app-product-card>

    </div>

    <app-button
        label="Enquire Now"
        variant="primary">
    </app-button>

</section>

<!-- WHY CHOOSE US -->

<section class="why-made">

    <div class="section-header">
        <p>WHY CHOOSE US</p>
        <h2>Experience Siddha at its Source.</h2>
    </div>

    <div class="feature-grid">

        <app-feature-card
            category="AUTHENTIC HERITAGE"
            title="Ancient Healing Traditions"
            description="Experience Siddha where it originated through authentic therapies, traditional wisdom, and guidance from experienced practitioners."
            image="assets/images/tourism/heritage.png">
        </app-feature-card>

        <app-feature-card
            category="HOLISTIC WELLNESS"
            title="Personalized Wellness Journey"
            description="Every experience is carefully designed around your wellness goals with customized therapies, nutrition, and lifestyle recommendations."
            image="assets/images/tourism/wellness.png">
        </app-feature-card>

        <app-feature-card
            category="CULTURAL IMMERSION"
            title="Live the Siddha Lifestyle"
            description="Immerse yourself in nature, organic farming, traditional cuisine, mindful practices, and the timeless rhythm of conscious living."
            image="assets/images/tourism/immersion.png">
        </app-feature-card>

    </div>

</section>

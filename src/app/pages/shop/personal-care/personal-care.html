<app-hero

category="PERSONAL CARE & BEAUTY"

title="Skin remembers the soil."

description="Premium skincare, haircare, and anti-aging — from herb to bottle, with nothing diluted in between."

buttonText="Shop Beauty"

image="assets/images/shop/personal-home.png">

</app-hero>

<app-chips

[chips]="categories">

</app-chips>

<section class="products">

    <div class="section-label">

        [LEAD PRODUCTS]

    </div>

    <div class="product-grid">

        <app-product-card
        category="HERBAL HAIR OIL"
    title="Revitalizing Amla Hair Oil"
    description="A nutrient-rich herbal hair oil infused with fresh amla and traditional Siddha botanicals to strengthen roots, promote healthy growth, and restore natural shine."
    price="₹799"
    image="assets/images/shop/personal1.png"></app-product-card>

        <app-product-card
        category="FACE CARE"
    title="Age-Defying Turmeric & Saffron Face Cream"
    description="A luxurious herbal face cream enriched with turmeric, saffron, and nourishing botanicals to brighten the complexion, improve elasticity, and reveal radiant skin."
    price="₹1,099"
    image="assets/images/shop/personal2.png"></app-product-card>

        <app-product-card
         category="BODY CARE"
    title="Nourishing Neem & Aloe Body Wash"
    description="A gentle botanical body wash formulated with neem and aloe vera to cleanse deeply, soothe irritation, and leave your skin feeling refreshed, soft, and naturally hydrated."
    price="₹649"
    image="assets/images/shop/personal3.png"></app-product-card>

    </div>

    <app-button
        label="Build Your Ritual"
        variant="dark">
    </app-button>

</section>
<app-promise-strip
    [promises]="[
        'Cruelty-Free',
        'No Synthetics',
        'Made in Indian Soil'
    ]">
</app-promise-strip>
